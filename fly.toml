# Fly.io configuration — https://fly.io/docs/reference/configuration/
#
#   fly launch --no-deploy
#   fly deploy
#
# The image payloads are baked into the Docker image, so a 1 GB volume is only
# needed to persist the resize cache between restarts.
app = "naso-profumi-clone"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  NODE_OPTIONS = "--max-old-space-size=192"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine warm so a demo is always up.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.http_options]
    h2_backend = false

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

# No volume is needed: the image payload is baked into the container image, and
# the resized-image cache is a pure speed optimisation that the app rebuilds on
# demand after a restart.
[vm]
  size = "shared-cpu-1x"
  memory = "512mb"
